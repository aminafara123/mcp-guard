[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Security scanner and allow/deny policy linter for MCP (Model Context Protocol) servers."
authors = [{ name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
mcp-guard = "mcpguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mcpguard"]
